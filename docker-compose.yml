services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messenger}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://messenger:${POSTGRES_PASSWORD:-messenger}@db:5432/messenger
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      UPLOAD_DIR: /data/uploads
      TURN_HOST: ${TURN_HOST:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_USERNAME: ${TURN_USERNAME:-messenger}
      TURN_PASSWORD: ${TURN_PASSWORD:-change-turn-password}
      PUBLIC_SHARE_BASE_URL: ${PUBLIC_SHARE_BASE_URL:-}
      SHARE_TTL_DAYS: ${SHARE_TTL_DAYS:-30}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "8082:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  turn:
    image: coturn/coturn:4.6-alpine
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-messenger.local}
      - --user=${TURN_USERNAME:-messenger}:${TURN_PASSWORD:-change-turn-password}
      - --listening-port=${TURN_PORT:-3478}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
    restart: unless-stopped

volumes:
  db_data: {}
  uploads: {}
